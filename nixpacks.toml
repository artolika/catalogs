# nixpacks.toml

[phases.setup]
# Install nginx to serve static files
nixPkgs = ["nginx"]

[phases.build]
cmds = [
  "mkdir -p /usr/share/nginx/html",
  "cp -r rexa /usr/share/nginx/html/",
  "cp -r arturo /usr/share/nginx/html/",
  "cp -r artolika /usr/share/nginx/html/",
  "cp -r doorware /usr/share/nginx/html/",
  "echo '<h1>Catalogs Root</h1>' > /usr/share/nginx/html/index.html"
]

[start]
cmd = "nginx -g 'daemon off;'"
